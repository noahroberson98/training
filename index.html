<!DOCTYPE html>
<html lang="en">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Training · Noah</title>
<style>
:root{
  --bg:#0b0b0f;--surface:#15151b;--surface2:#1c1c24;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);
  --text:#f4f4f6;--muted:#8b8b98;--faint:#5d5d69;--accent:#7b8cff;--accent-soft:rgba(123,140,255,.14);
  --good:#3ddc84;--good-soft:rgba(61,220,132,.13);--bad:#ff7a70;--bad-soft:rgba(255,122,112,.12);
  --amber:#f5c451;--amber-soft:rgba(245,196,81,.12);--cls:var(--accent);--cls-soft:var(--accent-soft);--rg:var(--good);--ry:var(--amber);--rr:var(--bad);
  --r:20px;--r-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
h1{font-size:32px;line-height:1.1;margin:2px 0 0;font-weight:750;letter-spacing:-.025em}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--text)}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{padding:7px 18px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.card{background:var(--surface);border-radius:var(--r);padding:18px}
.stack>*+*{margin-top:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main,.aside{min-width:0}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) 340px;gap:24px}.aside{position:sticky;top:20px;align-self:start}}
/* week strip */
.wk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wk-head .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.chev{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chev:hover{background:var(--surface2);color:var(--text)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 8px;border-radius:14px}
.day .dn{font-size:12px;font-weight:600;color:var(--faint)}
.day .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;color:var(--muted)}
.day.has .num,.day.hascl .num{color:var(--text)}
.day.today .num{color:var(--accent)}
.day.sel .num{background:var(--text);color:var(--bg)}
.day .dots{display:flex;gap:3px;height:5px}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day .dot.cl{background:var(--cls)}
.day .rec{font-size:12px;font-weight:600;height:12px;line-height:12px;opacity:.75;font-variant-numeric:tabular-nums}
.rec.g{color:var(--rg)}.rec.y{color:var(--ry)}.rec.r{color:var(--rr)}
.recdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 4px 1px 6px;vertical-align:middle}
.recdot.g{background:var(--rg)}.recdot.y{background:var(--ry)}.recdot.r{background:var(--rr)}
.cls{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:14px 18px;position:relative;overflow:hidden}
.cls::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--cls)}
.cls .tm{width:52px;flex:none;text-align:center;line-height:1.1}
.cls .tm b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cls .tm span{font-size:12px;color:var(--muted);font-weight:600}
.cls .x{flex:1;min-width:0}.cls .x div{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls .x span{font-size:13px;color:var(--muted)}
.cls .src{font-size:12px;color:var(--cls);font-weight:650;letter-spacing:.07em;margin-bottom:2px}
.bdg{font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:7px;flex:none}
.bdg.res{background:var(--cls-soft);color:var(--cls)}
.wh{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.wh b{color:var(--text,#e8ecf3);font-weight:650}.wh .wl{color:var(--rg);font-weight:700;letter-spacing:.06em;font-size:12px}
.bdg.done{background:rgba(61,220,132,.13);color:var(--rg)}.bdg.cx{background:transparent;color:var(--rr);border:1px solid var(--line2)}
.cc.past{opacity:.85}.cc .b.done{background:rgba(61,220,132,.13);color:var(--rg)}.cc .b.cx{background:transparent;color:var(--rr)}.cc .w{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.bdg.wait{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.day.has .dot{background:var(--accent)}
.day.has.completed .dot{background:var(--good)}
.day.has.skipped .dot{background:var(--bad)}
/* hero */
.hero{display:flex;gap:16px;align-items:center}
.hero .t{flex:1;min-width:0}
.hero h2{font-size:26px;margin:2px 0 6px;font-weight:720;letter-spacing:-.02em}
.date{font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.completed{background:var(--good-soft);color:var(--good)}.pill.skipped{background:var(--bad-soft);color:var(--bad)}
.pill.progress{background:var(--amber-soft);color:var(--amber)}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .c b{font-size:18px;font-weight:700}.ring .c span{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:17px;font-weight:650}.stat span{font-size:12px;color:var(--muted)}
/* exercises */
.sec-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:24px 4px 10px}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.group .tag{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.08em;padding:12px 18px 0}
.ex{padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:start}
.ex+.ex{border-top:1px solid var(--line)}
.lab{grid-row:span 3;width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.ex.done .lab{background:var(--good-soft);color:var(--good)}
.name{font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;min-width:0}
.name .nm{overflow:hidden;text-overflow:ellipsis}
.info{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;color:var(--faint);flex:none}
.info:hover,.info.on{color:var(--accent)}
.rx{grid-column:2;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rx .dash{color:var(--faint)}
.note{grid-column:2/4;font-size:13px;color:var(--text);background:var(--accent-soft);border-radius:10px;padding:8px 11px;margin-top:8px;display:none}
.note.on{display:block}
.chips{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--good-soft);color:var(--good);font-variant-numeric:tabular-nums}
.chip.local{background:transparent;border:1px dashed rgba(61,220,132,.45)}
.chip.best{background:var(--good);color:#06210f}
.ex .add{grid-row:1/3;grid-column:3;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.ex .add:hover{color:var(--text)}
.chip .cx{margin-left:6px;opacity:.7;cursor:pointer;background:none;border:0;color:inherit;font-weight:700}
.exnotes{grid-column:2/4;margin-top:8px;font-size:13px;color:var(--muted,#9aa)}
.exnotes button{font-size:12px;margin-left:8px;background:var(--surface2);border-radius:8px;padding:2px 8px}
.logrow textarea{flex:1;min-width:0;min-height:44px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;outline:none;color:inherit;font:inherit}
.bwrow{grid-column:2/4;margin-top:8px;display:flex;gap:8px}
.bwrow button,.gset,.tbtn{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:7px 12px;font-weight:650;color:inherit;cursor:pointer}
.bwrow button.on,.gset.on{background:var(--good-soft);color:var(--good)}
.gset{display:block;width:100%;margin-top:8px}
.timer{display:flex;align-items:center;gap:10px;margin-top:12px}.timer b{font-variant-numeric:tabular-nums;font-size:18px}
.clsrun{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.clsrun textarea{width:100%;min-height:40px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:6px 10px;color:inherit;font:inherit}
.syncbar{font-size:12px;opacity:.75;margin-top:6px}
.logfor{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.warnbox{background:var(--amber-soft);border:1px solid rgba(245,196,81,.45);color:var(--amber);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13px}.warnbox ul{margin:6px 0 0 18px;padding:0}
.skiprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.chip.skipc{background:var(--bad-soft);color:var(--bad);font-weight:700;border-radius:999px;padding:3px 10px}.ex.skipped{opacity:.55}.ex.skipped .nm{text-decoration:line-through}.skip-btn{display:block;width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--bad);font-size:15px;font-weight:600}.skip-btn.on{background:var(--bad-soft)}
.sbadge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-right:14px;white-space:nowrap}.sbadge.ok{color:var(--good)}.sbadge.wait{color:var(--amber)}.sbadge.err{color:var(--bad)}
.gundo{margin-top:6px;font-size:13px;opacity:.8}
.syncform input{width:100%;box-sizing:border-box;margin-top:10px;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--text)}.syncform p{font-size:13px;color:var(--muted)}
.logrow{grid-column:2/4;display:none;gap:8px;margin-top:10px}
.logrow.on{display:flex}
.logrow input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;outline:none}
.logrow input:focus{border-color:var(--accent)}
.logrow button{background:var(--accent);color:#0b0b16;font-weight:650;border-radius:10px;padding:0 14px}
.ex-note{grid-column:2/4;font-size:13px;color:var(--muted);margin-top:6px;font-style:italic}
details.warm{background:var(--surface);border-radius:var(--r);padding:0}
details.warm summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;font-weight:600}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary .chv{transition:transform .2s}
details.warm[open] summary .chv{transform:rotate(90deg)}
details.warm .ex{border-top:1px solid var(--line)}
.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}
/* aside */
.aside h3{font-size:15px;margin:0 0 14px;font-weight:650}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.wrow:first-of-type{border-top:0}
.wrow .d{width:42px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.wrow .d b{display:block;font-size:18px;color:var(--text)}
.wrow .x{flex:1;min-width:0}.wrow .x div{font-weight:600}.wrow .x span{font-size:13px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.hsearch{display:flex;gap:8px;margin:4px 0 12px}.hsearch input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.hsearch button{font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}.hsearch button.on{color:var(--text);border-color:var(--accent)}
.sess .best2{font-size:12px;color:var(--muted);margin-top:4px}.chip.pp{opacity:.8;font-style:italic}
.lastx{margin:6px 0 2px;font-size:13px;color:var(--muted);line-height:1.5}.lastx b{color:var(--text);font-weight:600}.lastx button{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:0 0 0 6px;cursor:pointer}
/* history */
.hrow{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
.hrow+.hrow,.hdetail+.hrow{border-top:1px solid var(--line)}
.hrow .x{flex:1;min-width:0}.hrow .x div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .x span{font-size:13px;color:var(--muted)}
.hrow .best{text-align:right;min-width:78px}.hrow .best b{display:block;font-variant-numeric:tabular-nums}
.hrow .best span{font-size:12px;color:var(--muted);letter-spacing:.05em}
.hdetail{display:none;padding:0 18px 14px}
.hdetail.on{display:block}
.sess{display:flex;gap:12px;align-items:baseline;padding:7px 0;font-size:14px}
.sess .dd{width:64px;color:var(--muted);flex:none}
.sess .chips{margin:0}
.hint2{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:2px 0 10px;font-size:13px;color:var(--muted);line-height:1.6}.hint2 b{color:var(--text);font-variant-numeric:tabular-nums}
.scard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--surface2)}
.scard .sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.scard .sh .t{font-weight:650;font-size:14px}.scard .sh .t span{color:var(--muted);font-weight:500}
.scard .sub{font-size:12px;color:var(--muted);margin-top:2px}.scard .sub a{color:var(--accent);text-decoration:none}
.srow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .n{width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:12px;display:grid;place-items:center;flex:none}
.srow .v{flex:1}.srow .v small{color:var(--muted);font-size:12px;margin-left:6px}
.srow.top .n{background:var(--accent);color:#000}.srow.top .v{font-weight:650}
.prb{font-size:12px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:999px;background:var(--accent);color:#000}
.dlt{font-size:12px;font-weight:600;white-space:nowrap}.dlt.up{color:var(--good,#4ade80)}.dlt.dn{color:var(--bad,#f87171)}.dlt.eq{color:var(--muted)}
.sfoot{font-size:12px;color:var(--muted);margin-top:6px}
.cls{flex-wrap:wrap}.cls .posted{flex-basis:100%;font-weight:400}.posted{margin-top:2px;font-size:13px;line-height:1.5;color:var(--text);background:var(--surface2);border-radius:10px;padding:8px 10px;white-space:normal}.posted .ph{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}.posted.none{color:var(--muted);font-style:italic}
.sempty{font-size:13px;color:var(--muted);margin-top:6px}
.sgrid{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums;font-size:14px}
.sgrid th{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 6px 4px;text-transform:uppercase}
.sgrid{table-layout:fixed}.sgrid th,.sgrid td{white-space:nowrap}.sgrid td{padding:6px;border-top:1px solid var(--line);color:var(--text)}
.sgrid th.r,.sgrid td.r{text-align:right}.sgrid .c{width:38px;color:var(--muted)}.sgrid .k{width:52px;text-align:right}
.sgrid td small{color:var(--muted);font-size:13px}.sgrid th small{text-transform:none;font-weight:500;letter-spacing:0}.sgrid b.dev{color:#d97706}
.sgrid tr.bst td{background:var(--accent-soft);font-weight:650}.sgrid tr.bst td:first-child{border-radius:8px 0 0 8px}.sgrid tr.bst td:last-child{border-radius:0 8px 8px 0}
.lastx .sgrid{font-size:13px;margin:4px 0}.hxs{border-left:2px solid var(--surface2);padding-left:8px;margin-top:4px}.hxt{font-size:12px;letter-spacing:.02em}.hx{font-variant-numeric:tabular-nums;color:var(--text)}.hx .d{color:var(--muted)}.hxs{cursor:pointer}.hxm{color:var(--accent);font-size:12px}.hxfull{display:none}.hxs.open .hxfull{display:block}.hxs.open .hxsum{display:none}.hxf{background:var(--surface2);border-radius:10px;padding:8px 10px;margin:6px 0}.hxfh{color:var(--text);font-size:13px}.hxn{font-size:12px;margin-top:4px}.hxall{margin-top:6px;width:100%}
/* settings */
.menu{position:absolute;right:20px;top:72px;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:6px;min-width:250px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:10}
.menu.on{display:block}
.menu button,.menu a{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--text);text-decoration:none}
.menu button:hover{background:rgba(255,255,255,.05)}
.menu .meta{padding:8px 12px 6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.hide{display:none!important}
/* ---- week calendar (drag & drop) ---- */
.grid.full{grid-template-columns:minmax(0,1fr)!important}
.app.wide{max-width:1480px}
.wk-top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.wk-top .lbl{font-weight:650;font-size:15px}
.wk-top .hint{margin-left:auto;font-size:12px;color:var(--faint)}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.col{background:var(--surface);border-radius:18px;padding:10px;min-height:360px;transition:background .15s,box-shadow .15s;display:flex;flex-direction:column}
.col-h{display:flex;align-items:baseline;gap:6px;padding:4px 4px 10px;width:100%;text-align:left}
.col-h .dn{font-size:12px;font-weight:650;color:var(--faint);letter-spacing:.05em}
.col-h .num{font-size:20px;font-weight:700;color:var(--muted)}
.col.today .col-h .num{color:var(--accent)}
.col-h .rec{margin-left:auto;font-size:12px;font-weight:650;opacity:.8}
.col .items{flex:1;display:flex;flex-direction:column;gap:8px;min-height:44px}
.col .rest{font-size:12px;color:var(--faint);padding:6px 4px}
.col.over{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.col.over .rest{opacity:0}
.wc{position:relative;display:flex;gap:6px;align-items:flex-start;background:var(--surface2);border-radius:13px;padding:10px 8px 10px 4px;border-left:3px solid var(--accent);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:opacity .18s,transform .18s}
.wc:hover{background:#22222c}
.wc.completed{border-left-color:var(--good)}.wc.skipped{border-left-color:var(--bad);opacity:.75}
.wc .grip{flex:none;width:18px;height:22px;display:grid;place-items:center;color:var(--faint);touch-action:none}
.wc:hover .grip{color:var(--muted)}
.wc .x{flex:1;min-width:0}
.wc .tt{font-size:14px;font-weight:650;line-height:1.25}
.wc .mm{font-size:12px;color:var(--muted);margin-top:2px}

function parseSets(t){
  const out=[];
  for(let raw of t.split(/[,;]/)){let s=raw.trim().toLowerCase().replace(/×|\*/g,"x").replace(/\s*x\s*/g,"x").replace(/\s*@\s*/g,"@").replace(/lbs?|#/g,"");
    if(!s) continue; let m;
    const D=x=>{let q; if(q=x.match(/^(\d+):(\d{1,2})$/)) return +q[1]*60+ +q[2]; if(q=x.match(/^(\d+(?:\.\d+)?)s(ec)?$/)) return +q[1]; if(q=x.match(/^(\d+(?:\.\d+)?)min$/)) return q[1]*60; return null};
    const Wt=x=>x==="bw"?null:(x.endsWith("kg")?Math.round(parseFloat(x)*2.20462*2)/2:parseFloat(x));
    if(m=s.match(/^(\d+)x(\d+)@(.+)$/)){for(let i=0;i<+m[1];i++) out.push({weight_lb:Wt(m[3]),reps:+m[2]}); continue}
    const d=D(s); if(d!=null){out.push({duration_s:d}); continue}
    if(/^\d+$/.test(s)){out.push({reps:+s}); continue}
    const p=s.split("x"); if(p.length>=2&&(p[0]==="bw"||!isNaN(parseFloat(p[0])))){const o={weight_lb:Wt(p[0])}; const dd=D(p[1]);
      if(dd!=null)o.duration_s=dd; else if(/^\d+(\.\d+)?m$/.test(p[1]))o.distance_m=parseFloat(p[1]); else if(/^\d+$/.test(p[1]))o.reps=+p[1]; else return null;
      if(o.weight_lb==null||isNaN(o.weight_lb)) delete o.weight_lb;
      for(let i=0;i<(+p[2]||1);i++) out.push({...o}); continue}
    return null;}
  return out.length?out:null;
}
// ---- smart notes parse: either order around x, lbs; bigger number = weight (lb), smaller = reps ----
function smartParse(t){
  const out=[],unclear=[];
  for(let raw of String(t||"").split(/[,;\n]+/)){let s=raw.trim().toLowerCase(); if(!s) continue;
    s=s.replace(/×|\*/g,"x").replace(/pounds?|lbs?\.?|#/g," lb ").replace(/\s+/g," ").trim();
    let m, n=1;
    s=s.replace(/^(?:(?:first|last|1st|2nd|3rd|4th|final|all|each)\s+(?:\d+\s+)?sets?\s*(?:at|@|of|:|-)?\s*)/,"");
    if(m=s.match(/^(\d+(?:\.\d+)?)\s*lb$/)){for(let i=0;i<n;i++) out.push({weight_lb:+m[1],reps:null}); continue}
    if(m=s.match(/^(?:(\d+)\s*sets?\s*(?:of)?\s*)(.*)$/)){n=+m[1]; s=m[2];}
    if(m=s.match(/^(\d+(?:\.\d+)?)\s*(lb)?\s*x\s*(\d+(?:\.\d+)?)\s*(lb)?(?:\s*x\s*(\d+))?$/)){
      let a=+m[1],b=+m[3],w,r; if(m[2]&&!m[4]){w=a;r=b}else if(m[4]&&!m[2]){w=b;r=a}else{w=Math.max(a,b);r=Math.min(a,b)}
      const k=m[5]?+m[5]:n; for(let i=0;i<k;i++) out.push({weight_lb:w,reps:Math.round(r)}); continue}
    if(m=s.match(/^(\d+(?:\.\d+)?)\s*lb\s*(?:for)?\s*(\d+)(?:\s*reps?)?$/)){for(let i=0;i<n;i++) out.push({weight_lb:+m[1],reps:+m[2]}); continue}
    if(m=s.match(/^(\d+)\s*(?:reps?\s*(?:@|at)?|@|at)\s*(\d+(?:\.\d+)?)\s*(lb)?$/)){for(let i=0;i<n;i++) out.push({weight_lb:+m[2],reps:+m[1]}); continue}
    if(m=s.match(/^(\d+(?:\.\d+)?)\s*(?:lb\s*)?for\s*(\d+(?:\.\d+)?)(?:\s*reps?)?$/)){const a=+m[1],b=+m[2]; for(let i=0;i<n;i++) out.push({weight_lb:Math.max(a,b),reps:Math.round(Math.min(a,b))}); continue}
    // ambiguous bare number: >25 or decimal = a weight (reps unknown), never a 280-rep set
    if(m=s.match(/^(\d+(?:\.\d+)?)$/)){const v=+m[1]; if(v>25||m[1].includes(".")){for(let i=0;i<n;i++) out.push({weight_lb:v,reps:null}); continue}}
    const old=parseSets(s.replace(/ lb /g,"")); if(old){for(let i=0;i<n;i++) out.push(...old); continue}
    unclear.push(raw.trim());}
  return {sets:out,unclear};
}

    t.closest(".group")?.querySelectorAll(".logrow textarea").forEach(ta=>{if(ta.value.trim()!==(LXr({key:k},{label:ta.dataset.e.split("|")[0],name:ta.dataset.e.slice(ta.dataset.e.indexOf("|")+1)}).notes||"")) saveExNotes(k,ta.dataset.e,ta.value.trim());});

// ---------- complete workout / summary ----------
// Off-device sync: not connected yet (needs Noah's scoped token). Until then data stays in this browser.
const syncLabel=()=>SYNC.cfg().token?(SYNC.q().length?`Saving online… ${SYNC.q().length} waiting`:"Saved online ✓"):"Saved on this phone only. Turn on Online sync in ⚙ to save every change online.";
const MAILTO=""; // public site: no email address embedded (Noah 10/29); mail app asks for recipient
function summaryData(w){
  const rows=[]; let sets=0,reps=0,vol=0;
  const others=new Map(); W.forEach(o=>o.exercises.forEach(e=>{const k=norm(e.name); if(!others.has(k)) others.set(k,[]); if(o!==w) others.get(k).push(...allSets(o,e)); else others.get(k).push(...storeSets(e));}));
  w.exercises.forEach((e,i)=>{const ls=localSets(w,e), all=allSets(w,e); if(e.warmup&&!ls.length) return;
    const prevBest=bestOf(others.get(norm(e.name))||[]), b=bestOf(ls);
    const pr=!!(b&&b.weight_lb!=null&&prevBest&&better(b,prevBest)) || !!(b&&b.weight_lb!=null&&!prevBest);
    all.forEach(x=>{sets++; reps+=x.reps||0; vol+=(x.weight_lb||0)*(x.reps||0);});
    rows.push({i,e,all,ls,pr,best:b});});
  return {rows,sets,reps,vol};
}
const shortDate=d=>pd(d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}).replace(",","");
function payloadObj(w,note){
  const x=[]; w.exercises.forEach((e,i)=>{const ls=localSets(w,e), n=local[w.key]?.exercises?.[ek(e)]?.notes; if(!ls.length&&!n) return;
    x.push([i,ls.map(s=>(s.duration_s==null&&s.distance_m==null)?[s.weight_lb??null,s.reps??null]:{w:s.weight_lb,r:s.reps,d:s.duration_s,m:s.distance_m}),n||undefined]);});
  return {v:1,k:w.key,i:(local[w.key]?.cid)||(Math.random().toString(36).slice(2,8)+Date.now().toString(36)),
    s:"completed",d:w.date!==w.orig?w.date:undefined,n:note||undefined,x,r:local[w.key]?.rounds||undefined,t:local[w.key]?.started_at?[local[w.key].started_at,local[w.key].ended_at||null]:undefined};
}
function b64(bytes){let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s);}
async function encodePayload(o){
  const raw=new TextEncoder().encode(JSON.stringify(o));
  if(window.CompressionStream){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    const z=new Uint8Array(await new Response(cs).arrayBuffer()); if(z.length<raw.length) return "z1:"+b64(z);}catch(e){}}
  return "j1:"+b64(raw);
}
async function buildEmail(w,note){
  const S=summaryData(w), p=payloadObj(w,note); local[w.key]=local[w.key]||{exercises:{}}; local[w.key].cid=p.i; saveLocal();
  const subject=`Workout complete: ${w.title} · ${shortDate(w.date)}`;
  const head=[`${w.title} · ${shortDate(w.date)}`,`${S.sets} sets · ${num(S.reps)} reps · ${num(S.vol)} lb volume`,""];
  const lines=S.rows.filter(r=>r.all.length).map(r=>`${r.pr?"★ ":""}${r.e.name}: ${r.all.map(label).join(", ")}`);
  const prs=S.rows.filter(r=>r.pr).map(r=>`${r.e.name} ${label(r.best)}`);
  const tail=[...(prs.length?["","New bests: "+prs.slice(0,4).join("; ")+(prs.length>4?` (+${prs.length-4} more)`:"")]:[]),...(note?["","Notes: "+note]:[]),"","--- data (don't edit) ---",await encodePayload(p)];
  const mk=L=>`mailto:${MAILTO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent([...head,...L,...tail].join("\n"))}`;
  const more=L=>L.length<lines.length?[...L,`(+${lines.length-L.length} more in dashboard)`]:L;
  let L=lines, url=mk(L);
  if(url.length>1800){L=lines.map(l=>l.length>48?l.slice(0,46)+"…":l); url=mk(L);}
  while(url.length>1800&&L.length){L=L.slice(0,-1); url=mk(more(L));}
  const text=[...head,...lines,...tail].join("\n");
  return {subject,url,text};
}
function completeIssues(w){
  const out=[], S=summaryData(w), taps=Object.values(local[w.key]?.rounds||{}).reduce((a,b)=>a+b,0);
  const unread=[]; w.exercises.forEach(e=>{const x=local[w.key]?.exercises?.[ek(e)]; (x?.unclear||[]).forEach(u=>unread.push(`${e.name}: “${u}”`));});
  if(unread.length) out.push(`Notes I couldn't read as sets (kept as notes): ${unread.join("; ")}`);
  if(taps&&!S.sets) out.push(`You tapped Log Set ${taps}× but 0 sets were counted.`);
  else if(!S.sets) out.push("0 sets logged for this workout.");
  return out;
}
function openSummary(key){
  const w=W.find(x=>x.key===key); if(!w) return;
  local[w.key]=local[w.key]||{exercises:{}};
  document.querySelectorAll(".logrow textarea").forEach(ta=>{if(ta.dataset.w===w.key&&ta.value.trim()&&ta.value.trim()!==(local[w.key].exercises?.[ta.dataset.e]?.notes||"")) saveExNotes(w.key,ta.dataset.e,ta.value.trim());});
  working(w).filter(isBW).forEach(e=>{const x=LX(w.key,ek(e)); if(!x.done) x.done=new Date().toISOString();});
  const issues=completeIssues(w);
  if(issues.length&&statusOf(w)!=="completed"&&!confirm("Before you complete:\n\n• "+issues.join("\n• ")+"\n\nComplete anyway? (You can edit after.)")) return;
  const L=local[w.key]; L.status="completed"; L.completed_at=new Date().toISOString(); if(L.started_at&&!L.ended_at) L.ended_at=L.completed_at; touch(w.key); render();
  const S=summaryData(w);
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.id="sheet";
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Workout summary"><div class="grab"></div>
   <div class="sd">${esc(pd(w.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}))}</div><h2>${esc(w.title)}</h2><span class="pill completed">Completed</span>
   <div class="sst"><div><b>${S.sets}</b><span>sets</span></div><div><b>${S.reps?num(S.reps):"—"}</b><span>reps</span></div><div><b>${S.vol?num(S.vol):"—"}</b><span>lb volume</span></div></div>
   ${S.rows.map(r=>`<div class="sx"><div class="n"><span>${esc(r.e.name)}</span>${r.pr?`<span class="pr">★ NEW BEST</span>`:""}</div><div class="c">${r.all.length?r.all.map(x=>esc(label(x))).join(" · "):"not logged"}</div></div>`).join("")}
   ${issues.length?`<div class="warnbox"><b>Check these</b><ul>${issues.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`:""}
   <textarea id="sumNote" placeholder="Optional notes (how it felt, anything to change)…">${esc(local[w.key].note||"")}</textarea>
   <div class="syncbar" id="sumSync">${syncLabel()}</div><div class="acts"><button class="sec" id="sumCopy">Copy summary</button><button class="sec" id="sumClose">Done</button></div></div>`;
  document.body.appendChild(bg);
  const note=()=>document.getElementById("sumNote").value.trim();
  const refresh=async()=>{local[w.key].note=note(); const em=await buildEmail(w,note()); return em;};
  refresh(); document.getElementById("sumNote").addEventListener("change",()=>{local[w.key].note=note(); touch(w.key);});
  document.getElementById("sumCopy").addEventListener("click",async()=>{const em=await refresh(); const t=`Subject: ${em.subject}\n\n${em.text}`;
    try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();}
    showToast("Summary copied",null);});
  const close=()=>bg.remove(); document.getElementById("sumClose").addEventListener("click",close);
  bg.addEventListener("click",ev=>{if(ev.target===bg) close();});
}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-complete]"); if(b){ev.stopPropagation(); openSummary(b.dataset.complete);}},true);

const FEAT=(EXTRA&&EXTRA.features)||{};
const hm=d=>d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+" CT";
function lateInfo(c,now=new Date()){
  const start=new Date(`${c.date}T${c.time||"00:00"}:00`); let late=null;
  if(/THIS STRENGTH/i.test(c.class)) late=start; else if(/REFORMER/i.test(c.class)) late=new Date(start-3600e3);
  const lines=[];
  if(/WAIT/.test(c.status||"")) lines.push("Waitlist spot.");
  if(!late) lines.push("Check the gym's late-cancel rule; $15 may apply.");
  else if(now>=late) lines.push("⚠ This is a late cancel — $15 fee.");
  else{lines.push(`Free to cancel until ${hm(late)}${late<start?" (1 hr before)":" (class start)"}.`);
    if(late-now<15*60e3) lines.push("⚠ Request may not process before the late-cancel window.");}
  return {late,lines};
}
function feeLines(c,now){return ["Fees: a $15 fee applies to a late cancel, or to a no-show on a class with a waitlist.",...lateInfo(c,now).lines];}
function classLine(c){const t=t12(c.time); return `${c.class} · ${shortDate(c.date)}, ${t.h} ${t.ap}${c.coach?" with "+c.coach:""}`;}
function cancelText(c,now){
  return [classLine(c),"",...feeLines(c,now),"","To cancel, cancel it in the THIS Gym app or tell This Gym Fitness in chat. It'll drop off here once it's cancelled."].join("\n");}
let cancelClass=k=>{const c=CLS.find(x=>ckey(x)===k); if(c) alert(cancelText(c));};

// ---------- online sync: every change -> one JSON file in Noah's private GitHub repo ----------
// The token lives ONLY in this phone's localStorage (tpDash.sync.v1). It is never in the page source or the repo.
const SYNC=(()=>{
  const KC="tpDash.sync.v1", KQ="tpDash.syncq.v1", KS="tpDash.syncseen.v1", REPO="noahroberson98/training-logs";
  const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}}, wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const cfg=()=>rd(KC,{}), setCfg=c=>wr(KC,c), q=()=>rd(KQ,[]), setQ=v=>wr(KQ,v);
  const api=()=>(localStorage.getItem("tpDash.syncapi.v1")||"https://api.github.com").replace(/\/$/,"");
  const repo=()=>cfg().repo||REPO;
  let state="idle", busy=false, timer=null;
  const dev=()=>{const c=cfg(); if(!c.device){c.device=Math.random().toString(36).slice(2,10); setCfg(c);} return c.device;};
  const b64u=s=>btoa(unescape(encodeURIComponent(s))), unb64u=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
  const hdr=()=>({"Authorization":"Bearer "+cfg().token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
  function derived(k){const w=W.find(x=>x.key===k); if(!w) return null; const ex={};
    w.exercises.forEach(e=>{const ls=localSets(w,e), n=local[k]?.exercises?.[ek(e)]?.notes; const sk=local[k]?.exercises?.[ek(e)]?.skipped||0; if(ls.length||n||sk) ex[ek(e)]={skipped:sk,sets:ls.map(s=>{const o={}; ["weight_lb","reps","duration_s","distance_m"].forEach(f=>{if(s[f]!=null) o[f]=s[f]}); if(s.per_plan) o.per_plan=true; if(s.round) o.round=true; return o;}),notes:n||null};});
    return {date:w.date,orig:w.orig,title:w.title,status:local[k]?.status||null,exercises:ex,note:local[k]?.note||null,started_at:local[k]?.started_at||null,ended_at:local[k]?.ended_at||null};}
  function event(k,why){const at=new Date().toISOString(), id=at.replace(/[-:.]/g,"")+"-"+dev()+"-"+Math.random().toString(36).slice(2,7);
    const ev={v:1,id,at,device:dev(),reason:why||"edit",key:k};
    if(k==="_moves"){ev.kind="moves"; ev.state=moves;} else {ev.kind=k.startsWith("_")?"meta":"workout"; ev.state=local[k]||null; if(ev.kind==="workout") ev.derived=derived(k);}
    return ev;}
  function push(k,why){if(!cfg().token) return; const Q=q(); Q.push(event(k,why)); setQ(Q); badge(); flush();}
  async function put(ev){const path=`events/${ev.at.slice(0,10)}/${ev.id}.json`;
    const r=await fetch(`${api()}/repos/${repo()}/contents/${path}`,{method:"PUT",headers:hdr(),body:JSON.stringify({message:`${ev.reason} ${ev.key}`,content:b64u(JSON.stringify(ev))})});
    if(r.ok||r.status===422) return true;   // 422 = file already exists -> already saved
    if(r.status===401||r.status===403||r.status===404){state="auth"; throw new Error("auth "+r.status);}
    throw new Error("http "+r.status);}
  async function flush(){if(busy||!cfg().token) return; busy=true; clearTimeout(timer);
    try{while(q().length){const ev=q()[0]; await put(ev); setQ(q().filter(x=>x.id!==ev.id)); markSeen(ev.id);} state="ok";}
    catch(e){if(state!=="auth") state="offline"; timer=setTimeout(flush,state==="auth"?120000:15000);}
    finally{busy=false; badge();}}
  const seen=()=>new Set(rd(KS,[])), markSeen=id=>{const s=rd(KS,[]); if(!s.includes(id)){s.push(id); wr(KS,s);}};
  async function pull(){if(!cfg().token) return 0;
    const r=await fetch(`${api()}/repos/${repo()}/git/trees/HEAD?recursive=1`,{headers:hdr()}); if(r.status===409||r.status===404) return 0; if(!r.ok) throw new Error("http "+r.status);
    const S=seen(), files=((await r.json()).tree||[]).filter(t=>t.type==="blob"&&/^events\/.+\.json$/.test(t.path)).map(t=>t.path).sort();
    let applied=0;
    for(const path of files){const id=path.split("/").pop().replace(/\.json$/,""); if(S.has(id)) continue;
      const g=await fetch(`${api()}/repos/${repo()}/contents/${path}`,{headers:hdr()}); if(!g.ok) continue;
      let ev; try{ev=JSON.parse(unb64u((await g.json()).content))}catch(e){continue}
      markSeen(id); if(ev.device===dev()) continue;
      if(ev.kind==="moves"){const mine=localStorage.getItem(LSM+".at")||""; if(ev.at>mine){moves=ev.state||{}; saveMoves("pull"); localStorage.setItem(LSM+".at",ev.at); applyMoves(); applied++;}}
      else if(ev.key){const cur=local[ev.key], ts=(ev.state&&ev.state.updated_at)||ev.at; if(!cur||ts>(cur.updated_at||"")){if(ev.state) local[ev.key]=ev.state; else delete local[ev.key]; applied++;}}}
    if(applied){saveLocal(); render();} return applied;}
  async function test(){const r=await fetch(`${api()}/repos/${repo()}`,{headers:hdr()});
    if(!r.ok) return {ok:false,msg:r.status===401?"Token rejected (expired or mistyped).":r.status===404?"Token can't see "+repo()+" — pick that repo when creating it.":"GitHub error "+r.status};
    const j=await r.json(); if(j.permissions&&j.permissions.push===false) return {ok:false,msg:"Token is read-only — set Contents to Read and write."};
    return {ok:true,msg:`Connected to ${j.full_name}${j.private?" (private)":""}.`};}
  function backfill(){const ks=Object.keys(local).filter(k=>local[k]); ks.forEach(k=>{const Q=q(); Q.push(event(k,"backfill")); setQ(Q);});
    if(Object.keys(moves).length){const Q=q(); Q.push(event("_moves","backfill")); setQ(Q);} const c=cfg(); c.backfilled=new Date().toISOString(); setCfg(c);}
  function badge(){const b=document.getElementById("syncBadge"); if(!b) return; if(!cfg().token){b.style.display=""; b.className="sbadge err"; b.textContent="Not syncing"; b.title="Tap to connect"; b.onclick=()=>openForm(); return;} b.onclick=null;
    const n=q().length; b.style.display=""; b.className="sbadge "+(state==="auth"?"err":n?"wait":"ok");
    b.textContent=state==="auth"?"Sync: fix token":n?`${n} waiting`:"Saved online ✓"; const sb=document.getElementById("sumSync"); if(sb) sb.textContent=syncLabel();}
  function openForm(){const c=cfg(); const bg=document.createElement("div"); bg.className="sheet-bg"; bg.id="syncSheet";
    bg.innerHTML=`<div class="sheet syncform" role="dialog" aria-label="Online sync"><div class="grab"></div><h2>Online sync</h2>
     <p>Every set, tap, note, edit, move and completion saves to your private GitHub repo <b>${esc(repo())}</b>. The token stays on this phone only.</p>
     <input id="syncTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${c.token?"Token saved — paste a new one to replace":"Paste fine-grained token (github_pat_…)"}">
     <div class="syncbar" id="syncMsg">${c.token?"Connected"+(c.backfilled?" · existing logs uploaded":""):"Not connected"}</div>
     <div class="acts"><button class="send" id="syncSave">Save &amp; test connection</button><button class="sec" id="syncTest">Test connection</button><button class="sec" id="syncOff">Disconnect</button><button class="sec" id="syncClose">Close</button></div></div>`;
    document.body.appendChild(bg); const msg=t=>document.getElementById("syncMsg").textContent=t, close=()=>bg.remove();
    bg.addEventListener("click",ev=>{if(ev.target===bg) close();}); document.getElementById("syncClose").onclick=close;
    document.getElementById("syncOff").onclick=()=>{const c=cfg(); delete c.token; setCfg(c); state="idle"; badge(); msg("Disconnected. Token removed from this phone.");};
    document.getElementById("syncTest").onclick=async()=>{if(!cfg().token) return msg("No token saved yet."); msg("Testing…"); try{const r=await test(); msg(r.msg);}catch(e){msg("Can't reach GitHub (offline?).");}};
    document.getElementById("syncSave").onclick=async()=>{const t=document.getElementById("syncTok").value.trim(); if(!t&&!cfg().token) return msg("Paste the token first.");
      const prev=cfg(); if(t){const c=cfg(); c.token=t; setCfg(c);} msg("Testing…");
      let r; try{r=await test();}catch(e){r={ok:false,msg:"Can't reach GitHub (offline?)."};}
      if(!r.ok){if(t){setCfg(prev);} badge(); return msg(r.msg+" Not saved.");}
      document.getElementById("syncTok").value=""; state="idle";
      if(!cfg().backfilled) backfill(); msg(r.msg+" Uploading…"); badge(); await flush();
      try{await pull();}catch(e){} msg(q().length?`${r.msg} ${q().length} waiting (will retry).`:`${r.msg} All logs saved online ✓`);};}
  document.addEventListener("click",ev=>{if(ev.target.closest("#mSync")){document.getElementById("menu").classList.remove("on"); openForm();}});
  window.addEventListener("online",()=>flush()); document.addEventListener("visibilitychange",()=>{if(!document.hidden){flush(); pull().catch(()=>{});}});
  setTimeout(()=>{badge(); if(cfg().token){flush(); pull().catch(()=>{});}},0);
  return {cfg,q,push,flush,pull,test,backfill,badge,derived,event,_state:()=>state};
})();
const syncPush=(k,why)=>SYNC.push(k,why);

document.addEventListener("click",ev=>{if(ev.target.closest("[data-gohist]")) return; const b=ev.target.closest("[data-hxtog]"); if(!b) return; ev.stopPropagation(); ev.preventDefault(); const k=b.dataset.hxtog; const o=!hxOpen.has(k); o?hxOpen.add(k):hxOpen.delete(k); b.classList.toggle("open",o); b.setAttribute("aria-expanded",o); b.querySelector(".hxc").textContent=o?"▴":"▾";},true);
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-cancelcls]"); if(b){ev.stopPropagation(); ev.preventDefault(); cancelClass(b.dataset.cancelcls);}},true);
render();
